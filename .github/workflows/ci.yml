name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Pure node:fs, no dependencies — fails in seconds on a version-bump PR that forgot
      # package-lock.json, instead of after a full npm ci (TechStackAudit.md D12).
      - run: node scripts/check-versions.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Report-only until TechStackAudit.md G5 sets a real ceiling from this job's own
      # numbers; then it starts failing the build like everything else here.
      - run: npm run bundle-budget -w @asohav/web

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # No @asohav/shared build step needed here, unlike the responsive job — verified directly
      # (moved dist/ aside and re-ran) rather than assumed: eslint.config.js deliberately uses
      # typescript-eslint's non-type-checked `recommended` preset (TechStackAudit.md D8), so
      # nothing here resolves a cross-package import, only parses each file's own syntax.
      - run: npm run lint

  # Renamed from `responsive` so the name `responsive` is free for the gate job below. A matrix
  # job never reports a check run under its bare name — it reports one per matrix entry — so the
  # names GitHub records here are `responsive-matrix (parchment)` and `responsive-matrix
  # (noticeboard)`. Branch protection cannot require either half meaningfully; require the
  # `responsive` gate below instead.
  responsive-matrix:
    runs-on: ubuntu-latest
    # WorkPlan-0.26.0 (G): the matrix gained a second appearance (Notice Board), which would
    # double this job's wall-clock time run serially in one job (~25-28 minutes locally). A
    # two-entry matrix over appearance keeps each job's own runtime flat instead.
    strategy:
      matrix:
        appearance: [parchment, noticeboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # @asohav/shared resolves to ./dist, which npm ci does not produce. The
      # build job happens to build it, but that is a separate checkout — without
      # this the harness cannot import the seed fixtures and Vite fails to boot.
      - run: npm run build -w @asohav/shared
      # `--with-deps` runs `apt-get update`, and the GitHub runner image ships Google's Chrome
      # apt repo in its sources. On 2026-09-09 Google republished that repo's Release file while
      # still serving the previous Packages.gz, so apt rejected the index with "Hash Sum
      # mismatch", `apt-get update` exited non-zero, and Playwright aborted with code 100 — CI
      # red on every PR, from an upstream mirror desync nothing in this repo touches. We install
      # Chromium from Playwright's own CDN, so that repo is of no use to us; dropping it before
      # the install means a Google-side desync can no longer take our CI down. Deliberately not
      # solved by dropping `--with-deps` instead: that would leave the OS shared libraries
      # Chromium needs entirely to whatever the runner image happens to ship, which is true today
      # and is not a guarantee.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/google.*
      # The smoke test renders the real pages through apps/web/harness.html
      # against those fixtures, so it needs no server or Supabase.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive -w @asohav/web
        env:
          SMOKE_APPEARANCE: ${{ matrix.appearance }}
      # The at-rest pass above never clicks, so a layout that only exists after a tap — an
      # expanded row, an open editor, a modal, a drawer — is invisible to it. 0.40.0 shipped an
      # overlapping-hit-area bug through it for exactly that reason. This drives each of those
      # states and reruns the same assertions (shared via scripts/hitChecks.mjs).
      #
      # A step in this job rather than a job of its own: it needs the same checkout, the same
      # `npm ci`, the same @asohav/shared build and the same Chromium install, and it splits over
      # the same appearance matrix. A separate job would pay all four again for no extra coverage.
      - run: npm run test:interaction -w @asohav/web
        env:
          INTERACTION_APPEARANCE: ${{ matrix.appearance }}

  # A stable, matrix-free check-run name for branch protection to require.
  #
  # Branch protection matches required status checks by *exact check-run name*. Before this job
  # existed the rule on `main` required `responsive`, which stopped being a real name at 0.26.0
  # when that job gained an appearance matrix — so it waited forever for a report nothing would
  # ever send, and PRs sat un-mergeable with "Expected — waiting for status to be reported" while
  # CI was entirely green. See HANDOFF.md item 7.
  #
  # This job reports under the bare name `responsive` no matter how the matrix below is shaped, so
  # a future appearance, viewport or platform dimension can be added without silently breaking
  # protection again. It runs no tests of its own — it only passes when every matrix leg passed.
  #
  # `if: always()` is load-bearing: without it this job would be *skipped* when the matrix fails,
  # and a skipped check does not satisfy a required check — the PR would block with no visible
  # failure explaining why. With it, the job runs and fails loudly, naming the aggregate result.
  responsive:
    runs-on: ubuntu-latest
    needs: responsive-matrix
    if: always()
    steps:
      - name: Require every responsive-matrix leg to have succeeded
        env:
          MATRIX_RESULT: ${{ needs.responsive-matrix.result }}
        run: |
          echo "responsive-matrix aggregate result: $MATRIX_RESULT"
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::responsive-matrix did not succeed (result: $MATRIX_RESULT)"
            exit 1
          fi
