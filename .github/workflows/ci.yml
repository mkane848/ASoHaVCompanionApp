name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Pure node:fs, no dependencies — fails in seconds on a version-bump PR that forgot
      # package-lock.json, instead of after a full npm ci (TechStackAudit.md D12).
      - run: node scripts/check-versions.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Report-only until TechStackAudit.md G5 sets a real ceiling from this job's own
      # numbers; then it starts failing the build like everything else here.
      - run: npm run bundle-budget -w @asohav/web

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # No @asohav/shared build step needed here, unlike the responsive job — verified directly
      # (moved dist/ aside and re-ran) rather than assumed: eslint.config.js deliberately uses
      # typescript-eslint's non-type-checked `recommended` preset (TechStackAudit.md D8), so
      # nothing here resolves a cross-package import, only parses each file's own syntax.
      - run: npm run lint

  responsive:
    runs-on: ubuntu-latest
    # WorkPlan-0.26.0 (G): the matrix gained a second appearance (Notice Board), which would
    # double this job's wall-clock time run serially in one job (~25-28 minutes locally). A
    # two-entry matrix over appearance keeps each job's own runtime flat instead.
    strategy:
      matrix:
        appearance: [parchment, noticeboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # @asohav/shared resolves to ./dist, which npm ci does not produce. The
      # build job happens to build it, but that is a separate checkout — without
      # this the harness cannot import the seed fixtures and Vite fails to boot.
      - run: npm run build -w @asohav/shared
      # The smoke test renders the real pages through apps/web/harness.html
      # against those fixtures, so it needs no server or Supabase.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive -w @asohav/web
        env:
          SMOKE_APPEARANCE: ${{ matrix.appearance }}
