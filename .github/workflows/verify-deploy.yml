name: Verify deploy reached live

# Render auto-deploys every commit to main (render.yaml's autoDeployTrigger: commit), but a failed
# deploy silently keeps the previous build serving — /api/health answers 200 either way, so nothing
# reports a problem. The 0.28.0 boot-crash incident served a two-week-old build for about four
# hours before anyone noticed. This workflow polls Render's API for the deploy triggered by this
# push and fails loudly (plus files an issue) if it doesn't reach `live`, instead of relying on
# someone remembering to check the Render dashboard. See docs/operations.md's Deployment section
# and HANDOFF.md item 7 / the `steward` skill for the fuller incident history.
#
# Needs a RENDER_API_KEY repository secret (Render dashboard -> Account Settings -> API Keys).
on:
  push:
    branches: [main]
  workflow_dispatch:

# The failure-issue step needs write access; many repos default GITHUB_TOKEN to read-only.
permissions:
  contents: read
  issues: write

env:
  RENDER_SERVICE_ID: srv-d9nqoqlaeets73ch25q0

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Poll Render until this commit's deploy reaches a terminal state
        id: poll
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "Waiting for a deploy of $SHA on service $RENDER_SERVICE_ID to reach a terminal state..."
          while true; do
            RESPONSE=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20")
            # Render's list endpoint has wrapped list items as either bare deploy objects or
            # { deploy: {...}, cursor }, depending on version — (.deploy // .) handles either shape
            # without needing to assume which one is live right now.
            MATCH=$(echo "$RESPONSE" | jq -c --arg sha "$SHA" \
              '[.[] | (.deploy // .)] | map(select(.commit.id == $sha)) | .[0] // empty')
            if [ -n "$MATCH" ]; then
              STATUS=$(echo "$MATCH" | jq -r '.status')
              DEPLOY_ID=$(echo "$MATCH" | jq -r '.id')
              echo "Deploy $DEPLOY_ID status: $STATUS"
              case "$STATUS" in
                live)
                  echo "status=live" >> "$GITHUB_OUTPUT"
                  echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "status=$STATUS" >> "$GITHUB_OUTPUT"
                  echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
                  echo "::error::Deploy $DEPLOY_ID for $SHA ended in status '$STATUS', not live. Render will still be serving the previous build."
                  exit 1
                  ;;
                *)
                  ;; # still in progress (created/queued/build_in_progress/update_in_progress/...) — keep polling
              esac
            fi
            sleep 20
          done
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      # Mirrors apply-migrations.yml's failure handling — a red run alone is easy to miss on a
      # solo-maintainer repo, and this is exactly the failure shape (green CI, merged PR, nothing
      # actually serving the new code) that cost the 0.28.0 incident about four hours.
      - name: File an issue if the deploy didn't reach live
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy did not reach live for ${context.sha.slice(0, 7)}`,
              labels: ['deploy-failed'],
              body: [
                `The Render deploy for commit ${context.sha} did not reach status \`live\` within 15 minutes.`,
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'A failed deploy leaves the previous build serving — /api/health answers 200 either way, so',
                'this will not announce itself anywhere else. Check the Render dashboard (or `list_deploys` /',
                '`list_logs` via the Render MCP tool) for the actual failure, fix it, and confirm the next',
                'deploy reaches `live` before treating this release as shipped.',
              ].join('\n'),
            });
