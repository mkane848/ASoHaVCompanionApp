services:
  - type: web
    name: asohav
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # NODE_ENV=production above also governs `npm ci` in buildCommand, which by default omits
      # devDependencies — including typescript's own @types/node, breaking the server's `tsc`
      # build. This forces devDependencies to install regardless of NODE_ENV; it's an npm install
      # setting only and has no effect on the app's own runtime behavior.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Project Settings → API (Supabase dashboard). Server-side only — SUPABASE_SERVICE_ROLE_KEY
      # bypasses RLS entirely, never expose it to the client.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Project Settings → Database → Connection pooling → URI. Must be the pooler connection
      # string (aws-*.pooler.supabase.com) — the direct-connection hostname is IPv6-only and
      # Render's network doesn't reach it.
      - key: DATABASE_URL
        sync: false
      # Same Project Settings → API values as above, but VITE_-prefixed so Vite inlines them into
      # the client bundle at build time — these are read during `buildCommand`, not at runtime.
      # VITE_SUPABASE_ANON_KEY is safe to expose to the browser; RLS + the server's own
      # authorization checks are what actually gate access.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Campaign invite emails (0.37.0, Issue 17) — see CLAUDE.md's "Architecture: campaign
      # invites" for the full dual-send-path writeup. Server-side only.
      #
      # Resend (resend.com) API key — the leg that mails an address that already has an account.
      # With this unset, that leg no-ops (via: 'none') rather than failing a request; the invite
      # code/link still work by hand regardless.
      - key: RESEND_API_KEY
        sync: false
      # The From address Resend sends invite emails as — must be a domain verified in the Resend
      # dashboard, not an arbitrary address.
      - key: INVITE_FROM_EMAIL
        sync: false
      # The public URL this deploy is reachable at (e.g. https://asohav.onrender.com) — used to
      # build the link an invite email points at. Deliberately a separate var from WEB_ORIGIN
      # (index.ts's CORS allow-origin, which defaults to http://localhost:5173 and is wrong here).
      - key: APP_BASE_URL
        sync: false
