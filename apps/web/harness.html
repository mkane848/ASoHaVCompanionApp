<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASoHaV harness</title>
    <!-- See index.html's matching script — same no-flash purpose, so the smoke test and
         screenshot script render the appearance they were asked for from first paint. -->
    <script>
      (function () {
        var v = 'parchment';
        try {
          if (localStorage.getItem('asohav.appearance') === 'noticeboard') v = 'noticeboard';
        } catch (e) {}
        document.documentElement.dataset.appearance = v;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/harness.tsx"></script>
  </body>
</html>
