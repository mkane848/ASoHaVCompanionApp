<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASoHaV</title>
    <!-- Sets data-appearance before any CSS paints, so a Parchment pick never flashes Notice
         Board first (Notice Board became the default in 0.39.0, WorkPlan-0.39.0.md item 1). Has
         to be inline and synchronous, ahead of every stylesheet — a module import runs after the
         parser reaches <body>, which is too late. Duplicates appearanceStore.ts's key name/
         default by hand; there's no way to share the module here, so keep the two in sync if
         either changes. -->
    <script>
      (function () {
        var v = 'noticeboard';
        try {
          if (localStorage.getItem('asohav.appearance.v2') === 'parchment') v = 'parchment';
        } catch (e) {}
        document.documentElement.dataset.appearance = v;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
